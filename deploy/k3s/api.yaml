apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: lab-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: lab-management-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3000"
            - name: AUTH_MODE
              value: hybrid
            - name: KEYCLOAK_CLIENT_ID
              value: lab-api
            - name: KEYCLOAK_AUDIENCE
              value: lab-api
            - name: XMU_CAS_ENABLED
              value: "false"
            - name: XMU_CAS_LOGIN_URL
              value: https://ids.xmu.edu.cn/authserver/login
            - name: XMU_CAS_VALIDATE_URL
              value: https://ids.xmu.edu.cn/authserver/serviceValidate
            - name: XMU_CAS_SERVICE_URL
              value: https://lab.wuosu.xyz/api/auth/xmu/callback
            - name: XMU_CAS_FRONTEND_URL
              value: https://lab.wuosu.xyz
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
