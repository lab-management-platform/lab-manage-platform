apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: lab-api
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: lab-management-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3000"
            - name: AUTH_MODE
              value: hybrid
            - name: KEYCLOAK_CLIENT_ID
              value: lab-api
            - name: KEYCLOAK_AUDIENCE
              value: lab-api
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
